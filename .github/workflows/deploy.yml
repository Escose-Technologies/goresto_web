name: Deploy Backend to OCI

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/deploy.yml'

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy backend to OCI server
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ubuntu
          key: ${{ secrets.OCI_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ~/goresto
            BEFORE=$(git rev-parse HEAD)
            git fetch origin main
            # Guard against a diverged server checkout: if HEAD has commits that
            # origin/main does not (e.g. a stray local/feature commit on the box),
            # --ff-only would fail every future deploy while prod silently stays
            # stale. Fail loudly with an actionable message instead of a cryptic
            # git error. Fix on the box: `git reset --hard origin/main`.
            AHEAD=$(git rev-list --count origin/main..HEAD)
            if [ "$AHEAD" != "0" ]; then
              echo "::error::Server checkout has diverged from origin/main ($AHEAD local commit(s) not on origin). Deploy aborted — reconcile on the box with 'git reset --hard origin/main'."
              exit 1
            fi
            # --ff-only so a failed/diverged pull aborts the deploy instead of
            # silently rebuilding stale code (with set -e the job then goes red).
            git pull --ff-only origin main
            AFTER=$(git rev-parse HEAD)
            echo "Deploying ${BEFORE} -> ${AFTER}"
            docker compose -f docker-compose.oci.yml build app
            docker compose -f docker-compose.oci.yml run --rm app npx prisma migrate deploy --schema=prisma/schema.prisma
            docker compose -f docker-compose.oci.yml up -d app
            docker image prune -f
            sleep 5
            # No "|| echo" — a failing health check must fail the job.
            curl -sf https://api.goresto.in/api/health
            echo "Deploy successful! (${AFTER})"
